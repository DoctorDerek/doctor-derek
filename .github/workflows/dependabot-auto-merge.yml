name: Dependabot Safe Update Merge

on:
  schedule:
    - cron: "37 2 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions: {}

env:
  DEPENDABOT_REQUIRED_CHECKS_JSON: '["Lint & Annotate PR","Reject Newly Vulnerable Dependencies","Playwright E2E Tests"]'

concurrency:
  group: dependabot-safe-merge
  cancel-in-progress: false

jobs:
  discover-updates:
    name: Discover Open Dependabot Updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      candidate-count: ${{ steps.candidates.outputs.candidate-count }}
      candidate-numbers-json: ${{ steps.candidates.outputs.candidate-numbers-json }}
    steps:
      - name: Find Open Dependabot Pull Requests
        id: candidates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 3
          script: |
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: context.payload.repository.default_branch,
              per_page: 100,
            });
            const candidateNumbers = pullRequests
              .filter(pullRequest => pullRequest.user?.login === 'dependabot[bot]')
              .map(pullRequest => pullRequest.number)
              .sort((firstNumber, secondNumber) => firstNumber - secondNumber);

            core.setOutput('candidate-count', candidateNumbers.length.toString());
            core.setOutput('candidate-numbers-json', JSON.stringify(candidateNumbers));
            core.info(
              candidateNumbers.length === 0
                ? 'No open Dependabot pull requests require evaluation.'
                : `Found Dependabot pull requests: ${candidateNumbers.join(', ')}.`,
            );

  evaluate-and-merge:
    name: Evaluate and Merge Verified Dependency Update
    needs: discover-updates
    if: needs.discover-updates.outputs.candidate-count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pull_request_number: ${{ fromJSON(needs.discover-updates.outputs.candidate-numbers-json) }}
    steps:
      - name: Collect Dependabot Pull Request Evidence
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEPENDABOT_PULL_REQUEST_NUMBER: ${{ matrix.pull_request_number }}
        with:
          retries: 3
          script: |
            const pullRequestNumber = Number.parseInt(
              process.env.DEPENDABOT_PULL_REQUEST_NUMBER,
              10,
            );
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequestNumber,
            });

            if (
              pullRequest.state !== 'open' ||
              pullRequest.user?.login !== 'dependabot[bot]'
            ) {
              core.info(
                `Pull request #${pullRequest.number} is no longer an open Dependabot update.`,
              );
              core.setOutput('is-ready-for-policy', 'false');
              return;
            }

            const changedFileResponses = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              },
            );
            const changedFiles = changedFileResponses.map(
              changedFile => changedFile.filename,
            );
            const { data: checkRunsResponse } =
              await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pullRequest.head.sha,
                filter: 'latest',
                per_page: 100,
              });
            const successfulCheckNames = checkRunsResponse.check_runs
              .filter(checkRun => checkRun.conclusion === 'success')
              .map(checkRun => checkRun.name);
            const successfulCheckNameSet = new Set(successfulCheckNames);
            const requiredCheckNames = JSON.parse(
              process.env.DEPENDABOT_REQUIRED_CHECKS_JSON,
            );
            const safeGroupPattern =
              /^dependabot\/(npm_and_yarn|github_actions)\/safe-(?:version|security)-updates(?:-[A-Za-z0-9]+)?$/;
            const safeGroupMatch = safeGroupPattern.exec(pullRequest.head.ref);
            let isSafeUpdate = Boolean(safeGroupMatch);
            const requiresActionPinVerification =
              !isSafeUpdate &&
              pullRequest.head.ref.startsWith('dependabot/github_actions/');

            if (requiresActionPinVerification) {
              const actionPinPattern = /^(\s*)uses:\s+([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+(?:\/[A-Za-z0-9_.-]+)*)@([0-9a-f]{40})\s+#\s+(v\d+(?:\.\d+){0,2})\s*$/;
              const workflowPathPattern = /^\.github\/workflows\/[^/]+\.ya?ml$/;
              const actionPinPairs = [];
              let hasOnlyActionPinChanges = changedFileResponses.length > 0;

              for (const changedFile of changedFileResponses) {
                if (
                  changedFile.status !== 'modified' ||
                  !workflowPathPattern.test(changedFile.filename) ||
                  !changedFile.patch
                ) {
                  hasOnlyActionPinChanges = false;
                  break;
                }

                const patchLines = changedFile.patch.split('\n');
                const removedLines = patchLines.filter(
                  line => line.startsWith('-') && !line.startsWith('---'),
                );
                const addedLines = patchLines.filter(
                  line => line.startsWith('+') && !line.startsWith('+++'),
                );

                if (
                  removedLines.length === 0 ||
                  removedLines.length !== addedLines.length
                ) {
                  hasOnlyActionPinChanges = false;
                  break;
                }

                for (let index = 0; index < removedLines.length; index += 1) {
                  const removedMatch = actionPinPattern.exec(
                    removedLines[index].slice(1),
                  );
                  const addedMatch = actionPinPattern.exec(
                    addedLines[index].slice(1),
                  );

                  if (
                    !removedMatch ||
                    !addedMatch ||
                    removedMatch[1] !== addedMatch[1] ||
                    removedMatch[2] !== addedMatch[2] ||
                    removedMatch[4] !== addedMatch[4] ||
                    removedMatch[3] === addedMatch[3]
                  ) {
                    hasOnlyActionPinChanges = false;
                    break;
                  }

                  actionPinPairs.push({
                    actionIdentifier: addedMatch[2],
                    commitSha: addedMatch[3],
                    versionTag: addedMatch[4],
                  });
                }

                if (!hasOnlyActionPinChanges) break;
              }

              const resolvedTags = new Map();

              for (const actionPinPair of actionPinPairs) {
                if (!hasOnlyActionPinChanges) break;

                const [owner, repo] = actionPinPair.actionIdentifier.split('/');
                const tagKey = `${owner}/${repo}@${actionPinPair.versionTag}`;
                let tagCommitSha = resolvedTags.get(tagKey);

                if (!tagCommitSha) {
                  try {
                    const { data: tagReference } = await github.rest.git.getRef({
                      owner,
                      repo,
                      ref: `tags/${actionPinPair.versionTag}`,
                    });
                    let tagObject = tagReference.object;

                    for (let depth = 0; depth < 3; depth += 1) {
                      if (tagObject.type === 'commit') break;

                      if (tagObject.type !== 'tag') {
                        hasOnlyActionPinChanges = false;
                        break;
                      }

                      const { data: annotatedTag } = await github.rest.git.getTag({
                        owner,
                        repo,
                        tag_sha: tagObject.sha,
                      });
                      tagObject = annotatedTag.object;
                    }

                    if (tagObject.type !== 'commit') {
                      hasOnlyActionPinChanges = false;
                      break;
                    }

                    tagCommitSha = tagObject.sha;
                    resolvedTags.set(tagKey, tagCommitSha);
                  } catch (error) {
                    core.warning(`Could not verify ${tagKey}: ${error.message}`);
                    hasOnlyActionPinChanges = false;
                    break;
                  }
                }

                if (tagCommitSha !== actionPinPair.commitSha) {
                  hasOnlyActionPinChanges = false;
                }
              }

              isSafeUpdate =
                hasOnlyActionPinChanges && actionPinPairs.length > 0;
            }

            const isReadyForPolicy =
              isSafeUpdate &&
              requiredCheckNames.every(requiredCheckName =>
                successfulCheckNameSet.has(requiredCheckName),
              );

            core.setOutput('author-login', pullRequest.user.login);
            core.setOutput('base-branch', pullRequest.base.ref);
            core.setOutput('base-sha', pullRequest.base.sha);
            core.setOutput('changed-files-json', JSON.stringify(changedFiles));
            core.setOutput('head-branch', pullRequest.head.ref);
            core.setOutput('head-sha', pullRequest.head.sha);
            core.setOutput('is-draft', pullRequest.draft.toString());
            core.setOutput('is-ready-for-policy', isReadyForPolicy.toString());
            core.setOutput('is-safe-update', isSafeUpdate.toString());
            core.setOutput('mergeable-state', pullRequest.mergeable_state);
            core.setOutput('pull-request-number', pullRequest.number.toString());
            core.setOutput('pull-request-state', pullRequest.state);
            core.setOutput(
              'successful-checks-json',
              JSON.stringify(successfulCheckNames),
            );
            core.info(
              isSafeUpdate
                ? `Classified #${pullRequest.number} as a safe dependency update.`
                : `Left #${pullRequest.number} for manual review: ${pullRequest.head.ref}.`,
            );

      - name: Checkout Trusted Default Branch
        if: steps.evidence.outputs.is-ready-for-policy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup pnpm
        if: steps.evidence.outputs.is-ready-for-policy == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        if: steps.evidence.outputs.is-ready-for-policy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install Trusted Policy Dependencies
        if: steps.evidence.outputs.is-ready-for-policy == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Evaluate Safe Merge Policy
        id: policy
        if: steps.evidence.outputs.is-ready-for-policy == 'true'
        run: node scripts/runTypeScript.mjs scripts/dependencies/dependabotMergePolicy.cli.ts
        env:
          DEPENDABOT_AUTHOR_LOGIN: ${{ steps.evidence.outputs.author-login }}
          DEPENDABOT_BASE_BRANCH: ${{ steps.evidence.outputs.base-branch }}
          DEPENDABOT_CHANGED_FILES_JSON: ${{ steps.evidence.outputs.changed-files-json }}
          DEPENDABOT_HEAD_BRANCH: ${{ steps.evidence.outputs.head-branch }}
          DEPENDABOT_IS_DRAFT: ${{ steps.evidence.outputs.is-draft }}
          DEPENDABOT_IS_SAFE_UPDATE: ${{ steps.evidence.outputs.is-safe-update }}
          DEPENDABOT_MERGEABLE_STATE: ${{ steps.evidence.outputs.mergeable-state }}
          DEPENDABOT_PULL_REQUEST_STATE: ${{ steps.evidence.outputs.pull-request-state }}
          DEPENDABOT_SUCCESSFUL_CHECKS_JSON: ${{ steps.evidence.outputs.successful-checks-json }}

      - name: Merge Verified Safe Dependency Update
        if: steps.policy.outputs.eligible == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEPENDABOT_BASE_SHA: ${{ steps.evidence.outputs.base-sha }}
          DEPENDABOT_HEAD_SHA: ${{ steps.evidence.outputs.head-sha }}
          DEPENDABOT_PULL_REQUEST_NUMBER: ${{ steps.evidence.outputs.pull-request-number }}
        with:
          retries: 3
          script: |
            const pullRequestNumber = Number.parseInt(
              process.env.DEPENDABOT_PULL_REQUEST_NUMBER,
              10,
            );
            const expectedBaseSha = process.env.DEPENDABOT_BASE_SHA;
            const expectedHeadSha = process.env.DEPENDABOT_HEAD_SHA;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequestNumber,
            });

            if (pullRequest.head.sha !== expectedHeadSha) {
              throw new Error(
                `Pull request #${pullRequestNumber} changed after verification.`,
              );
            }

            if (pullRequest.base.sha !== expectedBaseSha) {
              throw new Error(
                `The base branch changed after pull request #${pullRequestNumber} was verified.`,
              );
            }

            const { data: mergeResult } = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequestNumber,
              merge_method: 'merge',
              sha: expectedHeadSha,
            });

            if (!mergeResult.merged) {
              throw new Error(
                mergeResult.message ||
                  `GitHub declined to merge pull request #${pullRequestNumber}.`,
              );
            }

            const downstreamWorkflowIds = [
              'eslint-vitest-xstate.yml',
              'lighthouse.yml',
            ];

            for (const workflowId of downstreamWorkflowIds) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref: context.payload.repository.default_branch,
              });
            }

            core.info(
              `Merged verified dependency update #${pullRequestNumber} and dispatched main workflows.`,
            );
